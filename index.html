<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Portfolio X-Ray — Fincart</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Instrument+Serif&display=swap" rel="stylesheet">
<style>
  :root {
    --fc-primary: #0F766E;
    --fc-primary-dark: #0B5A54;
    --fc-primary-light: #14B8A6;
    --fc-accent: #1E40AF;
    --fc-bg: #FAFAF7;
    --fc-card: #FFFFFF;
    --fc-ink: #0B1220;
    --fc-muted: #64748B;
    --fc-border: #E7E5E0;
    --fc-success: #059669;
    --fc-warning: #D97706;
    --fc-danger: #DC2626;
  }
  html, body {
    font-family: 'Inter', system-ui, sans-serif;
    background: var(--fc-bg);
    color: var(--fc-ink);
    -webkit-font-smoothing: antialiased;
  }
  .serif { font-family: 'Instrument Serif', serif; font-weight: 400; letter-spacing: -0.01em; }
  .no-scrollbar::-webkit-scrollbar { display: none; }
  .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  .hairline { border-color: var(--fc-border); }
  .card-shadow { box-shadow: 0 1px 2px rgba(15,23,42,0.04), 0 8px 24px -12px rgba(15,23,42,0.08); }
  .card-shadow-lg { box-shadow: 0 1px 2px rgba(15,23,42,0.04), 0 20px 40px -20px rgba(15,23,42,0.18); }
  .grain::before {
    content: "";
    position: absolute; inset: 0;
    background-image: radial-gradient(rgba(15,23,42,0.035) 1px, transparent 1px);
    background-size: 3px 3px;
    pointer-events: none;
    opacity: 0.6;
  }
  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 10px; border-radius: 999px;
    font-size: 11px; font-weight: 500;
    background: #F1F5F4; color: #0F766E;
    border: 1px solid #E2E8F0;
  }
  .scroll-area { scroll-behavior: smooth; }
  .scroll-area::-webkit-scrollbar { width: 6px; height: 6px; }
  .scroll-area::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 3px; }
  .drawer-enter { animation: slideIn 0.35s cubic-bezier(0.16, 1, 0.3, 1); }
  @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
  .fade-in { animation: fadeIn 0.4s ease-out; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
  .ring-progress { transform: rotate(-90deg); }
  .hover-lift { transition: transform 0.25s ease, box-shadow 0.25s ease; }
  .hover-lift:hover { transform: translateY(-2px); box-shadow: 0 10px 30px -10px rgba(15,23,42,0.15); }
  .nav-item { transition: all 0.2s ease; }
  .nav-item:hover { background: rgba(15, 118, 110, 0.06); }
  .nav-item.active { background: rgba(15, 118, 110, 0.08); color: var(--fc-primary); }
  .nav-item.active::before {
    content: ""; position: absolute; left: 0; top: 8px; bottom: 8px;
    width: 3px; background: var(--fc-primary); border-radius: 0 3px 3px 0;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .status-pill {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 10px; border-radius: 6px;
    font-size: 11px; font-weight: 600;
  }
  .status-strong { background: #ECFDF5; color: #047857; }
  .status-watch { background: #FFFBEB; color: #B45309; }
  .status-review { background: #FEF2F2; color: #B91C1C; }
  .tooltip {
    position: relative;
  }
  .tooltip .tip {
    visibility: hidden; opacity: 0;
    position: absolute; bottom: calc(100% + 8px); left: 50%;
    transform: translateX(-50%);
    background: #0B1220; color: #fff;
    padding: 8px 12px; border-radius: 8px;
    font-size: 12px; width: 220px; text-align: left;
    transition: opacity 0.2s, visibility 0.2s;
    z-index: 50;
    font-weight: 400;
  }
  .tooltip:hover .tip { visibility: visible; opacity: 1; }
  .gradient-text {
    background: linear-gradient(135deg, #0F766E 0%, #14B8A6 100%);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .insight-card { position: relative; overflow: hidden; }
  .insight-card::after {
    content: ""; position: absolute; top: 0; right: 0;
    width: 120px; height: 120px;
    background: radial-gradient(circle, rgba(15,118,110,0.08), transparent 70%);
    pointer-events: none;
  }
  .tab-active {
    background: var(--fc-ink); color: white;
  }
  .metric-bar {
    height: 6px; border-radius: 3px; background: #F1F5F4; overflow: hidden;
  }
  .metric-bar-fill {
    height: 100%; border-radius: 3px;
    background: linear-gradient(90deg, #0F766E, #14B8A6);
    transition: width 0.8s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .overlap-node {
    transition: all 0.3s ease;
    cursor: pointer;
  }
  .overlap-node:hover { transform: scale(1.05); }
  .gauge-track { stroke: #F1F5F4; }
  .gauge-fill { transition: stroke-dashoffset 1s cubic-bezier(0.16, 1, 0.3, 1); }
  .table-row { transition: background 0.15s ease; }
  .table-row:hover { background: #FAFAF7; }
  .treemap-cell {
    transition: all 0.2s ease;
    cursor: pointer;
  }
  .treemap-cell:hover { opacity: 0.85; }
  .btn-primary {
    background: var(--fc-primary); color: white;
    padding: 10px 18px; border-radius: 10px;
    font-weight: 500; font-size: 14px;
    transition: all 0.2s ease;
    display: inline-flex; align-items: center; gap: 8px;
  }
  .btn-primary:hover { background: var(--fc-primary-dark); transform: translateY(-1px); }
  .btn-ghost {
    padding: 10px 16px; border-radius: 10px;
    font-weight: 500; font-size: 14px;
    border: 1px solid var(--fc-border);
    background: white; color: var(--fc-ink);
    transition: all 0.2s ease;
    display: inline-flex; align-items: center; gap: 8px;
  }
  .btn-ghost:hover { border-color: #CBD5E1; background: #FAFAF7; }
  .section-title {
    font-size: 22px; font-weight: 600; letter-spacing: -0.02em;
    color: var(--fc-ink);
  }
  .section-sub {
    font-size: 14px; color: var(--fc-muted);
    margin-top: 4px;
  }
  .divider { height: 1px; background: var(--fc-border); }
  .recharts-tooltip-wrapper { outline: none !important; }
  .custom-tooltip {
    background: white; border: 1px solid var(--fc-border);
    border-radius: 10px; padding: 10px 14px;
    box-shadow: 0 8px 24px -12px rgba(15,23,42,0.15);
    font-size: 12px;
  }
  .kbd {
    font-family: 'Inter'; font-size: 10px; font-weight: 600;
    padding: 2px 6px; border-radius: 4px;
    background: #F1F5F4; color: var(--fc-muted);
    border: 1px solid var(--fc-border);
  }
</style>
</head>
